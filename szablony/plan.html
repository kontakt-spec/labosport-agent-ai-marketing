<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan komunikacji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Grenze+Gotisch:wght@600&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f6f3; --panel:#ffffff; --panel2:#f4f4f0; --line:#e4e4de;
  --tx:#141414; --tx2:#5c5c57; --tx3:#8c8c86;
  --ok:#1f9d63; --warn:#b7791f; --bad:#c53b3b;
  --akcent:#3d8fd6; --akcent2:#d4532b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Lato,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:40px 24px 140px}
.top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx2);border-bottom:1px solid var(--line);padding-bottom:14px}
h1{font-size:44px;line-height:1.05;margin:36px 0 8px;font-weight:900;letter-spacing:-.01em}
.sub{color:var(--tx2);font-size:17px;margin:0 0 28px}
.zrodlo{margin:14px 0 0;font-size:13px;color:var(--tx2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:28px}
.stat{background:var(--panel);padding:16px 18px}
.stat b{display:block;font-size:28px;font-weight:300}
.stat span{font-size:12px;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em}
.sekcja{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx2);margin:36px 0 12px}
.zal{background:var(--panel);border:1px solid var(--line);padding:20px 22px;line-height:1.6;color:#2b2b28;white-space:pre-wrap}
.kamienie{display:grid;grid-template-columns:120px 1fr;gap:1px;background:var(--line);border:1px solid var(--line)}
.kamienie div{background:var(--panel);padding:10px 14px;font-size:14px}
.kamienie .d{color:var(--tx2)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 18px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--tx2);padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.chip.on{color:#fff;border-color:var(--tx);background:var(--tx)}
.spacer{flex:1}
/* kalendarz */
.mies{margin-bottom:26px}
.mies h3{font-weight:700;font-size:18px;margin:0 0 10px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.grid7 .h{background:var(--panel2);font-size:11px;color:var(--tx3);text-transform:uppercase;padding:6px 8px;letter-spacing:.06em}
.dz{background:var(--panel);min-height:92px;padding:6px;font-size:12px;min-width:0}
.dz.puste{background:var(--panel2)}
.dz .n{color:var(--tx3);font-size:11px;margin-bottom:4px;display:flex;justify-content:space-between}
.dz .k{color:var(--warn);font-size:10px;text-align:right}
.pill{display:block;padding:4px 6px;margin-bottom:3px;border-left:3px solid var(--tx3);background:var(--panel2);color:var(--tx);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.pill.post{border-color:var(--akcent)} .pill.karuzela{border-color:#8b6ae6} .pill.story{border-color:var(--akcent2)} .pill.rolka{border-color:var(--ok)}
.pill.akc{opacity:.5} .pill.usun{text-decoration:line-through;opacity:.4}
/* karty */
.karta{display:grid;grid-template-columns:260px 1fr;gap:26px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);padding:22px;margin-bottom:14px;scroll-margin-top:20px}
.karta.akc{border-left-color:var(--ok);background:#f3fbf7} .karta.zmien{border-left-color:var(--warn);background:#fdf8ef} .karta.usun{opacity:.45}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--tx2);margin-bottom:10px}
.badge{border:1px solid var(--line);background:var(--panel);padding:3px 8px;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.badge.f{color:var(--tx);border-color:#c9c9c2} .badge.warn{border-color:#e3c27a;background:#fdf5e2;color:#8a5a0e}
.temat{font-size:20px;font-weight:700;margin:0 0 12px}
.opis{white-space:pre-wrap;line-height:1.55;color:#22221f;font-size:15px;background:var(--panel2);padding:14px 16px;margin:0 0 10px}
.kom{font-size:13px;color:var(--tx2);margin-bottom:10px}
.kom b{color:var(--tx)}
.uz{font-size:13px;color:var(--tx3);margin-bottom:14px}
.decyzja{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-family:inherit;font-size:13px;padding:8px 14px;border:1px solid #cfcfc8;background:var(--panel);color:var(--tx);cursor:pointer}
.btn:hover{border-color:var(--tx)}
.btn.ok.on{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.zm.on{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.us.on{background:var(--bad);border-color:var(--bad);color:#fff}
textarea{width:100%;margin-top:10px;background:var(--panel);border:1px solid #cfcfc8;color:var(--tx);font-family:inherit;font-size:14px;padding:10px;min-height:64px;display:none}
textarea.on{display:block}
/* szkic grafiki (zostaje ciemny jak grafiki eventu) */
.szkic{position:relative;width:260px;aspect-ratio:4/5;background:#222 center/cover no-repeat;overflow:hidden;color:#fff}
.szkic.story{aspect-ratio:9/16;width:220px}
.szkic::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,0) 35%,rgba(0,0,0,.85) 100%)}
.szkic .logo{position:absolute;top:12px;left:12px;width:58px;z-index:2}
.szkic .tx{position:absolute;left:14px;right:14px;bottom:16px;z-index:2;text-align:center}
.szkic .h1{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;font-size:34px;line-height:.95;text-transform:uppercase;white-space:pre-line}
.szkic .h2{font-family:"Grenze Gotisch",Georgia,serif;color:var(--akcent);font-size:15px;margin-top:6px;text-transform:uppercase;white-space:pre-line}
.szkic.story .h2{font-size:12px}
.szkic .cta{display:inline-block;margin-top:10px;background:var(--akcent);font-size:8px;font-weight:700;padding:4px 10px;border-radius:3px;letter-spacing:.04em}
.szkic .brak{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9a9a94;font-size:12px;z-index:1}
.podpis{font-size:11px;color:var(--tx3);margin-top:6px;width:260px}
/* stopka */
.stopka{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.97);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.05)}
.stopka .in{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.licz{font-size:14px;color:var(--tx2)} .licz b{color:var(--tx)}
.glowny{background:var(--tx);color:#fff;border:0;font-weight:700;padding:11px 18px;font-family:inherit;font-size:14px;cursor:pointer}
.ogolne{flex-basis:100%;display:none}
.ogolne.on{display:block}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 16px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:760px){
  h1{font-size:32px}
  .karta{grid-template-columns:1fr}
  .szkic,.podpis{width:100%}
  .szkic.story{width:70%}
  .dz{min-height:64px;padding:3px}
  .pill{font-size:9px;padding:2px 3px}
  .kamienie{grid-template-columns:96px 1fr}
  .wrap{padding:28px 16px 190px}
  .stopka .in{padding:10px 16px;gap:8px}
  .stopka .btn,.glowny{padding:7px 10px;font-size:12px}
  .licz{flex-basis:100%;font-size:12px}
  .spacer{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span>LABOSPORT · Agent AI Marketing</span><span id="wersja"></span></div>
  <p class="zrodlo" id="zrodlo"></p>
  <h1 id="tytul"></h1>
  <p class="sub" id="okres"></p>
  <div class="stats" id="stats"></div>

  <div class="sekcja">Założenia planu</div>
  <div class="zal" id="zalozenia"></div>

  <div class="sekcja">Kamienie milowe w tym okresie</div>
  <div class="kamienie" id="kamienie"></div>

  <div class="sekcja">Kalendarz</div>
  <div class="bar" id="filtry"></div>
  <div id="kalendarz"></div>

  <div class="sekcja">Wszystkie pozycje</div>
  <div id="lista"></div>
</div>

<div class="stopka"><div class="in">
  <div class="licz" id="licz"></div>
  <div class="spacer"></div>
  <button class="btn" id="wszystko">Akceptuj wszystkie bez decyzji</button>
  <button class="btn" id="uwagiBtn">Uwagi ogólne</button>
  <button class="glowny" id="kopiuj">Kopiuj decyzje dla agenta</button>
  <textarea class="ogolne" id="ogolne" placeholder="Uwagi do całego planu, np. mniej postów o partnerach, więcej o biegach dzieci"></textarea>
</div></div>
<div class="toast" id="toast"></div>

<script>
const PLAN = /*__PLAN_JSON__*/null;
const FORMATY = {post:"Post", karuzela:"Karuzela", story:"Story", rolka:"Rolka"};
const RODZAJE = {informacyjny:"Informacyjny", kreatywny:"Kreatywny", sprzedazowy:"Sprzedażowy", partner:"Partner", spolecznosc:"Społeczność"};
const MIES = ["styczeń","luty","marzec","kwiecień","maj","czerwiec","lipiec","sierpień","wrzesień","październik","listopad","grudzień"];
const DNI = ["pn","wt","śr","cz","pt","so","nd"];
const KLUCZ = "labosport-plan-" + (PLAN && (PLAN.id || PLAN.event) || "x") + "-v" + (PLAN && PLAN.wersja || 1);

let stan = {};
try { stan = JSON.parse(localStorage.getItem(KLUCZ) || "{}"); } catch (e) { stan = {}; }
function zapisz(){ try { localStorage.setItem(KLUCZ, JSON.stringify(stan)); } catch (e) {} }
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.textContent = h; return n; };
const dataPL = s => { const d = new Date(s + "T12:00:00"); return d.getDate() + " " + ["stycznia","lutego","marca","kwietnia","maja","czerwca","lipca","sierpnia","września","października","listopada","grudnia"][d.getMonth()] + " " + d.getFullYear(); };
const dzienTyg = s => DNI[(new Date(s + "T12:00:00").getDay() + 6) % 7];
let filtr = "wszystko";

function init(){
  if (!PLAN){ document.body.textContent = "Brak danych planu."; return; }
  if (PLAN.styl){
    if (PLAN.styl.akcent) document.documentElement.style.setProperty("--akcent", PLAN.styl.akcent);
    if (PLAN.styl.akcent2) document.documentElement.style.setProperty("--akcent2", PLAN.styl.akcent2);
  }
  document.title = "Plan: " + (PLAN.event_nazwa || PLAN.event);
  document.getElementById("wersja").textContent = "Wersja " + (PLAN.wersja || 1) + " · " + (PLAN.status_tekst || "do akceptacji");
  document.getElementById("tytul").textContent = PLAN.event_nazwa || PLAN.event;
  document.getElementById("okres").textContent = "Plan na okres od " + dataPL(PLAN.okres.od) + " do " + dataPL(PLAN.okres.do);
  const cv = document.getElementById("zrodlo");
  const zmiana = (PLAN.aktualizacja || "").replace("T", ", ").slice(0, 17);
  cv.textContent = "Plan zapisany na Dysku Google (LABOSPORT Marketing AI)" +
    (zmiana ? " · ostatnia zmiana " + zmiana + (PLAN.zmienil ? ", " + PLAN.zmienil : "") : "");
  document.getElementById("zalozenia").textContent = PLAN.zalozenia || "";
  const k = document.getElementById("kamienie");
  (PLAN.kamienie || []).forEach(m => { k.append(el("div","d", dataPL(m.data))); k.append(el("div", null, m.opis)); });
  if (!(PLAN.kamienie || []).length) k.style.display = "none";
  rysujStaty(); rysujFiltry(); rysujKalendarz(); rysujListe(); licz();
}

function pozycje(){ return (PLAN.pozycje || []).slice().sort((a,b) => (a.data + (a.godzina||"")).localeCompare(b.data + (b.godzina||""))); }

function rysujStaty(){
  const s = document.getElementById("stats"); s.innerHTML = "";
  const p = pozycje();
  const ile = f => p.filter(x => x.format === f).length;
  [["Pozycji", p.length], ["Posty", ile("post")], ["Karuzele", ile("karuzela")], ["Stories", ile("story")], ["Rolki", ile("rolka")],
   ["Wymaga danych", p.filter(x => x.wymaga_danych).length]].forEach(([n,v]) => {
    const d = el("div","stat"); d.append(el("b", null, String(v))); d.append(el("span", null, n)); s.append(d);
  });
}

function rysujFiltry(){
  const f = document.getElementById("filtry"); f.innerHTML = "";
  [["wszystko","Wszystko"],["post","Posty"],["karuzela","Karuzele"],["story","Stories"],["rolka","Rolki"],["bez","Bez decyzji"]].forEach(([k,n]) => {
    const b = el("button","chip" + (filtr===k?" on":""), n);
    b.onclick = () => { filtr = k; rysujFiltry(); rysujKalendarz(); rysujListe(); };
    f.append(b);
  });
}

function pasuje(p){
  if (filtr === "wszystko") return true;
  if (filtr === "bez") return !stan[p.id] || !stan[p.id].d;
  return p.format === filtr;
}

function rysujKalendarz(){
  const box = document.getElementById("kalendarz"); box.innerHTML = "";
  const od = new Date(PLAN.okres.od + "T12:00:00"), dz = new Date(PLAN.okres.do + "T12:00:00");
  const kam = {}; (PLAN.kamienie || []).forEach(m => { (kam[m.data] = kam[m.data] || []).push(m.krotko || m.opis); });
  const poDniu = {}; pozycje().filter(pasuje).forEach(p => { (poDniu[p.data] = poDniu[p.data] || []).push(p); });
  let m = new Date(od.getFullYear(), od.getMonth(), 1, 12);
  while (m <= dz){
    const sek = el("div","mies"); sek.append(el("h3", null, MIES[m.getMonth()] + " " + m.getFullYear()));
    const g = el("div","grid7"); DNI.forEach(d => g.append(el("div","h",d)));
    const pierwszy = (m.getDay() + 6) % 7; for (let i=0;i<pierwszy;i++) g.append(el("div","dz puste"));
    const dni = new Date(m.getFullYear(), m.getMonth()+1, 0).getDate();
    for (let d=1; d<=dni; d++){
      const iso = m.getFullYear() + "-" + String(m.getMonth()+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
      const c = el("div","dz" + (iso < PLAN.okres.od || iso > PLAN.okres.do ? " puste" : ""));
      const n = el("div","n"); n.append(el("span", null, String(d)));
      if (kam[iso]) { const kk = el("span","k", "●"); kk.title = kam[iso].join("\n"); n.append(kk); }
      c.append(n);
      (poDniu[iso] || []).forEach(p => {
        const dec = (stan[p.id]||{}).d;
        const pl = el("span","pill " + p.format + (dec==="ok"?" akc":"") + (dec==="usun"?" usun":""), (p.godzina? p.godzina + " " : "") + (p.temat || p.naglowek || p.id));
        pl.title = p.temat; pl.onclick = () => document.getElementById("k-" + p.id).scrollIntoView({behavior:"smooth"});
        c.append(pl);
      });
      g.append(c);
    }
    sek.append(g); box.append(sek);
    m = new Date(m.getFullYear(), m.getMonth()+1, 1, 12);
  }
}

function szkic(p){
  const wrap = el("div");
  const s = el("div","szkic" + (p.format === "story" || p.format === "rolka" ? " story" : ""));
  if (p._img) s.style.backgroundImage = "url('" + encodeURI(p._img).replace(/'/g,"%27") + "')";
  else s.append(el("div","brak", p.zdjecie ? "zdjęcie: " + p.zdjecie : "bez zdjęcia"));
  if (PLAN._logo){ const l = el("img","logo"); l.src = encodeURI(PLAN._logo); l.alt = ""; s.append(l); }
  const tx = el("div","tx");
  tx.append(el("div","h1", p.naglowek || ""));
  if (p.podtytul) tx.append(el("div","h2", p.podtytul));
  if (p.cta_grafika) tx.append(el("span","cta", p.cta_grafika));
  s.append(tx); wrap.append(s);
  wrap.append(el("div","podpis", "Szkic poglądowy. Gotowa grafika powstaje w Canvie na szablonie eventu" + (p.wzorzec ? " (" + p.wzorzec + ")" : "") + "."));
  return wrap;
}

function rysujListe(){
  const box = document.getElementById("lista"); box.innerHTML = "";
  pozycje().filter(pasuje).forEach(p => {
    const dec = stan[p.id] || {};
    const k = el("div","karta" + (dec.d==="ok"?" akc":dec.d==="zmien"?" zmien":dec.d==="usun"?" usun":"")); k.id = "k-" + p.id;
    k.append(szkic(p));
    const prawa = el("div");
    const meta = el("div","meta");
    meta.append(el("span","badge f", FORMATY[p.format] || p.format));
    if (p.rodzaj) meta.append(el("span","badge", RODZAJE[p.rodzaj] || p.rodzaj));
    if (p.wymaga_danych) meta.append(el("span","badge warn", "Wymaga danych: " + p.wymaga_danych));
    meta.append(el("span", null, dzienTyg(p.data) + ", " + dataPL(p.data) + (p.godzina ? ", " + p.godzina : "")));
    meta.append(el("span", null, p.id));
    prawa.append(meta);
    prawa.append(el("h2","temat", p.temat || ""));
    if (p.opis) prawa.append(el("div","opis", p.opis));
    else if (p.opis_szkic){ const s = el("div","opis"); s.textContent = "Kierunek opisu: " + p.opis_szkic; prawa.append(s); }
    if (p.slajdy && p.slajdy.length){ const s = el("div","opis"); s.textContent = p.slajdy.map((x,i) => "Slajd " + (i+1) + ": " + x).join("\n"); prawa.append(s); }
    if (p.scenariusz){ const s = el("div","opis"); s.textContent = "Scenariusz rolki:\n" + p.scenariusz; prawa.append(s); }
    if (p.komentarz){ const c = el("div","kom"); c.append(el("b", null, "Pierwszy komentarz: ")); c.append(document.createTextNode(p.komentarz)); prawa.append(c); }
    if (p.uzasadnienie) prawa.append(el("div","uz", "Dlaczego teraz: " + p.uzasadnienie));
    const d = el("div","decyzja");
    const ta = el("textarea", dec.d==="zmien" ? "on" : ""); ta.placeholder = "Co zmienić? Np. inne zdjęcie, krótszy opis, przesunąć na piątek"; ta.value = dec.n || "";
    ta.oninput = () => { stan[p.id] = Object.assign(stan[p.id]||{}, {n: ta.value}); zapisz(); };
    [["ok","Akceptuję","ok"],["zmien","Zmień","zm"],["usun","Usuń","us"]].forEach(([v,n,c]) => {
      const b = el("button","btn " + c + (dec.d===v?" on":""), n);
      b.onclick = () => {
        const nowa = (stan[p.id]||{}).d === v ? null : v;
        stan[p.id] = Object.assign(stan[p.id]||{}, {d: nowa}); zapisz();
        rysujListe(); rysujKalendarz(); licz();
        if (nowa === "zmien") setTimeout(() => { const t = document.querySelector("#k-" + CSS.escape(p.id) + " textarea"); if (t) t.focus(); }, 0);
      };
      d.append(b);
    });
    prawa.append(d); prawa.append(ta);
    k.append(prawa); box.append(k);
  });
}

function licz(){
  const p = pozycje();
  const c = v => p.filter(x => (stan[x.id]||{}).d === v).length;
  const bez = p.length - c("ok") - c("zmien") - c("usun");
  document.getElementById("licz").innerHTML = "";
  const l = document.getElementById("licz");
  [["Akceptuję", c("ok")], ["Zmiany", c("zmien")], ["Usuń", c("usun")], ["Bez decyzji", bez]].forEach(([n,v], i) => {
    if (i) l.append(document.createTextNode(" · "));
    l.append(document.createTextNode(n + ": ")); l.append(el("b", null, String(v)));
  });
}

document.getElementById("wszystko").onclick = () => {
  pozycje().forEach(p => { if (!stan[p.id] || !stan[p.id].d) stan[p.id] = Object.assign(stan[p.id]||{}, {d:"ok"}); });
  zapisz(); rysujListe(); rysujKalendarz(); licz();
};
document.getElementById("uwagiBtn").onclick = () => document.getElementById("ogolne").classList.toggle("on");
const og = document.getElementById("ogolne"); og.value = stan._ogolne || "";
og.oninput = () => { stan._ogolne = og.value; zapisz(); };

document.getElementById("kopiuj").onclick = async () => {
  const p = pozycje();
  const grupa = v => p.filter(x => (stan[x.id]||{}).d === v);
  const linie = [];
  linie.push("DECYZJE DO PLANU: " + (PLAN.event_nazwa || PLAN.event) + ", okres " + PLAN.okres.od + " do " + PLAN.okres.do + ", wersja " + (PLAN.wersja || 1));
  linie.push("Plik planu: " + (PLAN._sciezka || "plan.json"));
  linie.push("");
  linie.push("AKCEPTUJĘ: " + (grupa("ok").map(x => x.id).join(", ") || "brak"));
  const zm = grupa("zmien");
  linie.push("ZMIEŃ:" + (zm.length ? "" : " brak"));
  zm.forEach(x => linie.push("- " + x.id + ": " + ((stan[x.id]||{}).n || "bez opisu zmiany").replace(/\s+/g, " ") + "   [temat: " + x.temat + "]"));
  linie.push("USUŃ: " + (grupa("usun").map(x => x.id).join(", ") || "brak"));
  const bez = p.filter(x => !(stan[x.id]||{}).d);
  linie.push("BEZ DECYZJI: " + (bez.map(x => x.id).join(", ") || "brak"));
  if (stan._ogolne) { linie.push(""); linie.push("UWAGI OGÓLNE: " + stan._ogolne); }
  const tekst = linie.join("\n");
  let ok = false;
  try { await navigator.clipboard.writeText(tekst); ok = true; } catch (e) {
    const t = document.createElement("textarea"); t.value = tekst; document.body.append(t); t.select();
    try { ok = document.execCommand("copy"); } catch (e2) {} t.remove();
  }
  const toast = document.getElementById("toast");
  toast.textContent = ok ? "Skopiowane. Wklej to w rozmowie z agentem." : "Nie udało się skopiować. Zaznacz tekst ręcznie.";
  toast.classList.add("on"); setTimeout(() => toast.classList.remove("on"), 2600);
};

init();
// Link z kotwicą (np. plan.html#k-CTM-2612-02) przewija do pozycji, gdy karty są już narysowane.
if (location.hash) setTimeout(() => { const c = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (c) c.scrollIntoView(); }, 60);
</script>
